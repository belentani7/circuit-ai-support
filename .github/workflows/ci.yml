name: CIRCUIT quality gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@10.4.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
      - name: Unit tests (clipboard and production privacy)
        run: pnpm test
      - name: Typecheck
        run: pnpm run check
      - name: Release build
        run: pnpm run build
      - name: Required public assets
        run: |
          test -s dist/public/index.html
          test -s dist/public/circuit-mark.svg
          test -s dist/public/circuit-flow.svg
