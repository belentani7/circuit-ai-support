name: CIRCUIT functional verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: circuit-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared pnpm 10 package manager
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
      - name: Install committed dependencies
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript
        run: pnpm check
      - name: Run regression suite
        run: pnpm exec vitest run tests/clipboard.test.ts
      - name: Compile deployable app
        run: pnpm build
      - name: Retain production build
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: circuit-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
